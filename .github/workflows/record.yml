name: record

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "رابط البث/الفيديو (اتركه فاضي لوضع الاستعداد — تجهيز بدون رابط)"
        required: false
        default: ""
      recording_id:
        description: "معرّف فريد للتسجيل (اتركه فاضي بوضع الاستعداد)"
        required: false
        default: ""
      recording_label:
        description: "اسم يظهر بالرسائل والعنوان بالقناة"
        required: false
        default: "تسجيل"
      status_chat_id:
        description: "الشات اللي توصله رسائل الحالة (اتركه فاضي بوضع الاستعداد)"
        required: false
        default: ""

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Record and upload
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SOURCE_URL: ${{ github.event.inputs.source_url }}
          RECORDING_ID: ${{ github.event.inputs.recording_id }}
          RECORDING_LABEL: ${{ github.event.inputs.recording_label }}
          STATUS_CHAT_ID: ${{ github.event.inputs.status_chat_id }}
        run: node server.js
